name: Bun CI

concurrency:
  group: bun-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    env:
      DATABASE_URL: "postgresql://opencut:opencut@localhost:5432/opencut"
      BETTER_AUTH_SECRET: "supersecret"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      UPSTASH_REDIS_REST_URL: "https://your-upstash-redis-url"
      UPSTASH_REDIS_REST_TOKEN: "your-upstash-redis-token"
      NEXT_PUBLIC_MARBLE_API_URL: "https://placeholder.example.com"
      MARBLE_WORKSPACE_KEY: "placeholder"
      FREESOUND_CLIENT_ID: "placeholder"
      FREESOUND_API_KEY: "placeholder"
      CLOUDFLARE_ACCOUNT_ID: "placeholder"
      R2_ACCESS_KEY_ID: "placeholder"
      R2_SECRET_ACCESS_KEY: "placeholder"
      R2_BUCKET_NAME: "placeholder"
      MODAL_TRANSCRIPTION_URL: "https://placeholder.example.com"
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          # 1.3.14 = the version local dev runs; also required for `bun test
          # --isolate` (not in 1.2.x), which the test step below relies on.
          bun-version: 1.3.14

      - name: Cache Bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('apps/web/bun.lock') }}

      - name: Install dependencies
        working-directory: apps/web
        run: bun install

      - name: Build
        working-directory: apps/web
        run: bun run build

      - name: Typecheck
        working-directory: apps/web
        run: bun run typecheck

      - name: Run tests
        working-directory: apps/web
        # --isolate runs each test file in a fresh global object, eliminating
        # bun's process-global mock.module/global-leak order-dependence (C8):
        # a plain `bun test` carries a known ~12-fail residual (proxy-encoder-
        # controller + add-to-editor, all green in isolation); --isolate is
        # deterministically 0-fail (measured 2177 pass / 0 fail, C16).
        run: bun test --isolate

  e2e:
    name: E2E happy path
    runs-on: ubuntu-latest

    # Reachable rate-limit store + real Postgres, so auth-flow.e2e.ts stops
    # self-skipping: better-auth enables rate limiting in production mode and
    # reads/writes it through Upstash's REST protocol (src/lib/auth/server.ts,
    # rateLimit.customStorage) on every /api/auth/* POST, BEFORE the request
    # ever touches the database. A plain `redis:` service doesn't speak that
    # protocol, so `srh` (hiett/serverless-redis-http, the standard Upstash
    # REST shim) fronts the `redis` service below and translates REST calls
    # into it -- same shape as this repo's docker-compose.yml. Previously
    # UPSTASH_REDIS_REST_URL pointed at an unreachable placeholder, so every
    # auth POST 500'd before hitting Postgres, and this spec's own beforeAll
    # health probe (see its header comment) detected that and skipped the
    # whole suite. `postgres` is the real account store once requests get
    # past rate limiting; the "Run DB migrations" step below applies schema
    # against it before the suite runs.
    services:
      postgres:
        # postgres:17 to match this repo's docker-compose.yaml (local-dev parity).
        image: postgres:17
        env:
          POSTGRES_USER: opencut
          POSTGRES_PASSWORD: opencut
          POSTGRES_DB: opencut
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U opencut"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      srh:
        image: hiett/serverless-redis-http:latest
        env:
          SRH_MODE: env
          SRH_TOKEN: e2e-test-token
          SRH_CONNECTION_STRING: "redis://redis:6379"
        ports:
          - 8079:80
        # No health check, matching docker-compose.yaml: srh answers an
        # unauthenticated GET with a 4xx, which wget --spider would treat as
        # unhealthy and wedge the service forever. srh boots in ms and the
        # suite doesn't hit it until well after the build steps.

    env:
      DATABASE_URL: "postgresql://opencut:opencut@localhost:5432/opencut"
      BETTER_AUTH_SECRET: "supersecret"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3210"
      UPSTASH_REDIS_REST_URL: "http://localhost:8079"
      UPSTASH_REDIS_REST_TOKEN: "e2e-test-token"
      NEXT_PUBLIC_MARBLE_API_URL: "https://placeholder.example.com"
      MARBLE_WORKSPACE_KEY: "placeholder"
      FREESOUND_CLIENT_ID: "placeholder"
      FREESOUND_API_KEY: "placeholder"
      CLOUDFLARE_ACCOUNT_ID: "placeholder"
      R2_ACCESS_KEY_ID: "placeholder"
      R2_SECRET_ACCESS_KEY: "placeholder"
      R2_BUCKET_NAME: "placeholder"
      MODAL_TRANSCRIPTION_URL: "https://placeholder.example.com"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          # 1.3.14 = the version local dev runs; also required for `bun test
          # --isolate` (not in 1.2.x), which the test step below relies on.
          bun-version: 1.3.14

      - name: Cache Bun modules
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('apps/web/bun.lock') }}

      - name: Install dependencies
        working-directory: apps/web
        run: bun install

      - name: Run DB migrations
        working-directory: apps/web
        run: bun run db:migrate

      - name: Install Playwright Chromium (+ OS deps)
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build (with E2E test seam)
        working-directory: apps/web
        run: bun run build:e2e

      - name: Run E2E happy-path smoke
        working-directory: apps/web
        run: bun run test:e2e

      # Runs after the happy-path smoke, never before: this build overwrites
      # .next, so the stub-export suite above must fully finish first.
      - name: Build (real-export seam)
        working-directory: apps/web
        run: bun run build:e2e:real

      - name: Run golden-path real-export e2e
        working-directory: apps/web
        run: bun run test:e2e:real

      # Reuses the real-export build from the previous step: the fidelity
      # config's webServer runs `bun run start` against the existing .next,
      # and NEXT_PUBLIC_* flags are inlined at BUILD time (webServer env
      # cannot flip them post-build) — so this must stay after
      # `build:e2e:real` and before any other build overwrites .next.
      - name: Run export-fidelity matrix e2e
        working-directory: apps/web
        run: bun run test:e2e:fidelity

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/playwright-report-real-export/
          retention-days: 7
          if-no-files-found: ignore
